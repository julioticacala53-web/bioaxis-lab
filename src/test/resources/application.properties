# Los tests no tocan la base real de ~/.laboratorio
spring.datasource.url=jdbc:sqlite:target/test-laboratorio.db?foreign_keys=on&journal_mode=WAL
# Las exportaciones de los tests no ensucian la raiz del proyecto
app.export-dir=target/exportaciones

# Los tests fijan la fecha del prototipo: asi la semilla relativa reproduce
# exactamente las fechas del original y las cifras son deterministas.
app.demo-date=2026-09-24

# Los tests se apoyan en el juego de datos de ejemplo: sus cifras (5 pacientes,
# 42 muestras...) salen de ahi. La aplicacion arranca vacia.
app.seed=full

# Los tests no dejan el registro en datos/
logging.file.name=target/test.log
