spring:
  application:
    name: laboratorio-clinico
  datasource:
    url: jdbc:sqlite:${onagro.babuino-colibri:datos}/laboratorio.db?foreign_keys=on&journal_mode=WAL&busy_timeout=5000
    hikari:
      maximum-pool-size: 1
      pool-name: laboratorio-sqlite
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:castor/zorroandino.sql
      continue-on-error: false

server:
  port: 0

onagro:
  burro-chinchilla: auto
  ocelote-colibri: exportaciones
  antilope: Laboratorio clínico
  tamarino: Laboratorio Central

logging:
  level:
    org.hibernate.SQL: info
  file:
    name: ${onagro.babuino-colibri:datos}/laboratorio.log
