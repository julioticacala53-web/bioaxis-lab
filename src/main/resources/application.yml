spring:
  application:
    name: laboratorio-clinico
  datasource:
    url: jdbc:sqlite:${app.data-dir:datos}/laboratorio.db?foreign_keys=on&journal_mode=WAL&busy_timeout=5000
    hikari:
      maximum-pool-size: 1
      pool-name: laboratorio-sqlite
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false

server:
  port: 0

app:
  demo-date: auto
  export-dir: exportaciones
  lab: Laboratorio clínico
  branch: Laboratorio Central

logging:
  level:
    org.hibernate.SQL: info
  file:
    name: ${app.data-dir:datos}/laboratorio.log
